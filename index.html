<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <style>
        #image {
            width: 600px;
            border: 3px solid #000000;
        }

        #meme_container {
            position: relative;
            display: inline-block;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <form>
        <p>Select a picture: <input type="file" id="user_picture" onchange="update_image()"></p>
        <p>Top text: <input type="text" id="top_text" oninput="update_text()" maxlength="70"></p>
        <p>Bottom text: <input type="text" id="bottom_text" oninput="update_text()" maxlength="70"></p>
    </form>

    <div id="meme_container">
        <canvas id="canvas" width="600" height="500"></canvas>
    </div>
    
    <button onclick="download_meme()">Download Meme</button>

    <script>
        var canvas = document.getElementById("canvas");
        var context = canvas.getContext("2d");
        var img = new Image();

        // Update image onto the canvas
        function update_image() {
            var file = document.querySelector('input[type=file]').files[0]; // Access the selected file
            img.src = window.URL.createObjectURL(file); // Set the image source to the selected file

            img.onload = function() {
                // Draw image to the canvas when loaded
                context.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas first
                canvas.width = img.width;
                canvas.height = img.height;
                context.drawImage(img, 0, 0, img.width, img.height);
                update_text(); // Redraw the text when the image changes
            };
        }

        // Write the text onto the meme
        function update_text() {
            var top_text = document.getElementById("top_text").value; // Get the top text
            var bottom_text = document.getElementById("bottom_text").value; // Get the bottom text

            if (img.complete) { // Only update the text if the image has already loaded
                context.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas before redrawing
                context.drawImage(img, 0, 0, canvas.width, canvas.height); // Redraw the image

                // Set up text properties
                context.font = "40px Impact";
                context.fillStyle = "white";
                context.textAlign = "center";
                context.lineWidth = 4;
                context.strokeStyle = "black";

                // Draw the top text
                if (top_text) {
                    context.textBaseline = "top"; // Align text to the top
                    context.fillText(top_text, canvas.width / 2, 10);
                    context.strokeText(top_text, canvas.width / 2, 10);
                }

                // Draw the bottom text
                if (bottom_text) {
                    context.textBaseline = "bottom"; // Align text to the bottom
                    context.fillText(bottom_text, canvas.width / 2, canvas.height - 10);
                    context.strokeText(bottom_text, canvas.width / 2, canvas.height - 10);
                }
            }
        }

        // Combine image and text onto a canvas and download
        function download_meme() {
            var link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = "meme-output.png";
            link.click();
        }
    </script>

</body>
</html>
