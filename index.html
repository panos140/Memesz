<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <style>
        #image {
            border: 3px solid #000000;
        }

        #meme_container {
            position: relative;
            display: inline-block;
            max-width: 100%; /* Ensures container fits within page */
        }

        canvas {
            display: block;
            max-width: 100%; /* Make the canvas responsive */
            height: auto;
        }
    </style>
</head>
<body>

    <form>
        <p>Select a picture: <input type="file" id="user_picture" onchange="update_image()"></p>
        <p>Top text: <input type="text" id="top_text" oninput="update_text()" maxlength="70"></p>
        <p>Top text size: <input type="range" id="top_text_size" min="10" max="100" value="30" oninput="update_text()"> <span id="top_text_size_value">30</span>px</p>
        <p>Bottom text: <input type="text" id="bottom_text" oninput="update_text()" maxlength="70"></p>
        <p>Bottom text size: <input type="range" id="bottom_text_size" min="10" max="100" value="30" oninput="update_text()"> <span id="bottom_text_size_value">30</span>px</p>
    </form>

    <div id="meme_container">
        <canvas id="canvas"></canvas>
    </div>
    
    <button onclick="download_meme()">Download Meme</button>

    <script>
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");
        const img = new Image();

        const MAX_WIDTH = 800; // Maximum width for the canvas
        const MAX_HEIGHT = 600; // Maximum height for the canvas

        // Update image onto the canvas
        function update_image() {
            const file = document.querySelector('input[type=file]').files[0]; // Access the selected file
            img.src = window.URL.createObjectURL(file); // Set the image source to the selected file

            img.onload = function () {
                // Calculate the new dimensions while maintaining aspect ratio
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    const aspectRatio = height / width;
                    width = MAX_WIDTH;
                    height = MAX_WIDTH * aspectRatio;
                }

                if (height > MAX_HEIGHT) {
                    const aspectRatio = width / height;
                    height = MAX_HEIGHT;
                    width = MAX_HEIGHT * aspectRatio;
                }

                // Resize the canvas to fit the image
                canvas.width = width;
                canvas.height = height;

                // Draw the resized image onto the canvas
                context.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
                context.drawImage(img, 0, 0, width, height);

                update_text(); // Redraw text when the image changes
            };
        }

        // Write the text onto the meme
        function update_text() {
            const top_text = document.getElementById("top_text").value; // Get the top text
            const bottom_text = document.getElementById("bottom_text").value; // Get the bottom text
            const top_text_size = document.getElementById("top_text_size").value; // Get top text size
            const bottom_text_size = document.getElementById("bottom_text_size").value; // Get bottom text size

            // Update text size values on the UI
            document.getElementById("top_text_size_value").textContent = top_text_size;
            document.getElementById("bottom_text_size_value").textContent = bottom_text_size;

            if (img.complete) { // Only update the text if the image has already loaded
                context.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas before redrawing
                context.drawImage(img, 0, 0, canvas.width, canvas.height); // Redraw the image

                // Set up text properties for top text
                context.font = `${top_text_size}px Impact`;
                context.fillStyle = "white";
                context.textAlign = "center";
                context.lineWidth = 4;
                context.strokeStyle = "black";

                // Draw the top text
                if (top_text) {
                    context.textBaseline = "top"; // Align text to the top
                    context.fillText(top_text, canvas.width / 2, 10);
                    context.strokeText(top_text, canvas.width / 2, 10);
                }

                // Set up text properties for bottom text
                context.font = `${bottom_text_size}px Impact`;

                // Draw the bottom text
                if (bottom_text) {
                    context.textBaseline = "bottom"; // Align text to the bottom
                    context.fillText(bottom_text, canvas.width / 2, canvas.height - 10);
                    context.strokeText(bottom_text, canvas.width / 2, canvas.height - 10);
                }
            }
        }

        // Combine image and text onto a canvas and download
        function download_meme() {
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = "memesz-output.png";
            link.click();
        }
    </script>

</body>
</html>
